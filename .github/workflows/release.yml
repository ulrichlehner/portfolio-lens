# Releases Portfolio Lens.
#
# - A push to main (a merged pull request) publishes vX.Y.Z when the commits since the last final
#   release contain a feat, fix, perf or breaking change. scripts/next-version.sh computes the
#   version; the tag is created with the release, on the pushed commit. Other pushes publish nothing.
# - A pushed tag vX.Y.Z-rc.N or vX.Y.Z on main publishes that version.
# - A manual run (workflow_dispatch) on any branch builds the archive of the version a merge would
#   release, with -SNAPSHOT, and uploads it as a workflow artifact, without a tag or a release.
#
# The version is not stored in pom.xml; the build gets it as -Drevision.
name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      range: ${{ steps.plan.outputs.range }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide mode and version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=""
          publish="false"
          tag=""
          range=""

          if [ "${REF_TYPE}" = "tag" ]; then
            # a pushed version tag: the tag is the version, and its commit must be on main
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "Commit ${GITHUB_SHA} is not on main" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            publish="true"
            tag="${REF_NAME}"
          else
            # the last final release reachable from this commit; release candidates do not count
            last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-rc.*' 2>/dev/null || true)"
            last="${last_tag#v}"
            last="${last:-0.0.0}"
            range="${last_tag:+${last_tag}..}HEAD"
            next="$(git log -z --no-merges --format=%B "${range}" | scripts/next-version.sh "${last}")"
            echo "Last final release: ${last_tag:-none}; next version: ${next:-none}"

            if [ "${EVENT}" = "workflow_dispatch" ]; then
              # dry run: the version a merge would release, or the next patch version
              if [ -z "${next}" ]; then
                next="${last%.*}.$(( ${last##*.} + 1 ))"
              fi
              version="${next}-SNAPSHOT"
            elif git tag --points-at HEAD | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "This commit already has a final release tag. Nothing to release."
            elif [ -z "${next}" ]; then
              echo "No feat, fix, perf or breaking change since ${last_tag:-the start}. Nothing to release."
            else
              if git rev-parse -q --verify "refs/tags/v${next}" > /dev/null; then
                echo "The tag v${next} already exists on another commit" >&2
                exit 1
              fi
              version="${next}"
              publish="true"
              tag="v${next}"
            fi
          fi

          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "tag=${tag}"
            echo "range=${range}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version:-none} publish=${publish} tag=${tag:-none}"

  build:
    name: Build archive
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # TreemapParityTest and PageSmokeTest run the page script in Node.js; without it they are skipped.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test
        run: mvn -B -Drevision="${VERSION}" verify

      - name: Fail if the Node.js tests were skipped
        run: |
          if grep -l '<skipped' target/surefire-reports/TEST-*TreemapParityTest.xml target/surefire-reports/TEST-*PageSmokeTest.xml; then
            echo "Node.js tests were skipped" >&2
            exit 1
          fi

      - name: Check the third-party list
        run: |
          for jar in target/lib/*.jar; do
            name="$(basename "${jar}")"
            if ! grep -qF "\`${name}\`" release/THIRD-PARTY.md; then
              echo "${name} is not listed in release/THIRD-PARTY.md" >&2
              exit 1
            fi
          done

      - name: Create the archive
        run: |
          dir="portfolio-lens-${VERSION}"
          mkdir -p "dist/${dir}/lib"
          cp target/portfolio-lens.jar "dist/${dir}/"
          cp target/lib/*.jar "dist/${dir}/lib/"
          cp LICENSE "dist/${dir}/"
          {
            sed -n '/^## Notice$/,/^## /p' README.md | sed '1d;$d'
            echo
            cat release/THIRD-PARTY.md
          } > "dist/${dir}/NOTICE"
          tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
          (cd dist && sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256" && sha256sum -c "${dir}.tar.gz.sha256")

      - name: Check the archive
        run: |
          mkdir check
          tar -C check -xzf "dist/portfolio-lens-${VERSION}.tar.gz"
          cd "check/portfolio-lens-${VERSION}"
          ls
          # without configuration the exit status is 64
          status=0
          java -jar portfolio-lens.jar check > ../check.log 2>&1 || status=$?
          cat ../check.log
          [ "${status}" -eq 64 ]
          # the jar manifest carries the version that Lens shows in its log and page footer
          jar xf portfolio-lens.jar META-INF/MANIFEST.MF
          tr -d "\r" < META-INF/MANIFEST.MF | grep -qxF "Implementation-Version: ${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-lens-${{ needs.plan.outputs.version }}
          path: |
            dist/portfolio-lens-*.tar.gz
            dist/portfolio-lens-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: portfolio-lens-${{ needs.plan.outputs.version }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RANGE: ${{ needs.plan.outputs.range }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          archive="dist/portfolio-lens-${VERSION}.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md"
          fence='```'
          {
            echo "Portfolio Lens ${VERSION}"
            echo
            echo "## Notice"
            echo
            sed -n '/^## Notice$/,/^## /p' README.md | sed '1,2d;$d'
            echo "## Use"
            echo
            echo "Requires a Java 21 runtime. Verify the download with sha256sum -c:"
            echo
            echo "${fence}"
            cat "${archive}.sha256"
            echo "${fence}"
            echo
            echo "Configuration and the contract for running a release: [Configuration](${base}#configuration) and [Releases](${base}#releases)."
            case "${TAG}" in
              *-rc.*)
                echo
                echo "This release candidate is for testing the server integration."
                ;;
            esac
            # a release on merge lists what changed since the previous final release
            if [ -n "${RANGE}" ]; then
              changes="$(git log -z --no-merges --format=%B "${RANGE}" | scripts/next-version.sh --changes)"
              if [ -n "${changes}" ]; then
                echo
                echo "## Changes"
                echo
                printf '%s\n' "${changes}" | sed 's/^/- /'
              fi
            fi
          } > notes.md
          flags=()
          case "${TAG}" in
            *-rc.*) flags+=(--prerelease) ;;
          esac
          # a pushed tag exists already; for a merge the release creates the tag on the merged commit
          if [ "${REF_TYPE}" = "tag" ]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "${GITHUB_SHA}")
          fi
          gh release create "${TAG}" "${archive}" "${archive}.sha256" \
            --title "Portfolio Lens ${VERSION}" --notes-file notes.md "${flags[@]}"
